<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Top Arc for DA VINCI GRILL -->
    <path id="topArc" d="M 80,250 A 170,210 0 0,1 420,250" fill="none" />
    <!-- Bottom Arc for & RESTAURANT -->
    <path id="bottomArc" d="M 420,250 A 170,210 0 0,1 80,250" fill="none" />
  </defs>

  <!-- Outer concentric decorative rim -->
  <ellipse cx="250" cy="250" rx="195" ry="235" fill="none" stroke="currentColor" stroke-width="1.8" />
  
  <!-- Hatched collar rim -->
  <ellipse cx="250" cy="250" rx="187" ry="226" fill="none" stroke="currentColor" stroke-width="6" stroke-dasharray="2 3.5" />
  <ellipse cx="250" cy="250" rx="180" ry="218" fill="none" stroke="currentColor" stroke-width="1.2" />

  <!-- Inner border ring -->
  <ellipse cx="250" cy="250" rx="142" ry="176" fill="none" stroke="currentColor" stroke-width="1.2" />
  <ellipse cx="250" cy="250" rx="138" ry="172" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.7" />

  <!-- Arched Text Top: DA VINCI GRILL -->
  <text font-family="'Cinzel', 'Playfair Display', serif" font-size="28" font-weight="600" letter-spacing="9" fill="currentColor">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">DA VINCI GRILL</textPath>
  </text>

  <!-- Arched Text Bottom: & RESTAURANT -->
  <text font-family="'Cinzel', 'Playfair Display', serif" font-size="23" font-weight="500" letter-spacing="8" fill="currentColor">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">&amp; RESTAURANT</textPath>
  </text>

  <!-- Subtitle HYD -->
  <text x="250" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="7" fill="currentColor" text-anchor="middle">
    HYD
  </text>

  <!-- Central Engraved Steak & Board Illustration -->
  <g transform="translate(145, 175)" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wood Cutting Board -->
    <ellipse cx="105" cy="85" rx="80" ry="36" stroke-width="1.6" />
    <path d="M 25,85 C 25,98 50,112 105,112 C 160,112 185,98 185,85" stroke-width="1.6" />
    <!-- Cutting board thickness lines -->
    <path d="M 32,89 L 32,96" stroke-width="1.2" />
    <path d="M 178,89 L 178,96" stroke-width="1.2" />
    <path d="M 105,108 L 105,112" stroke-width="1" />
    
    <!-- Cutting board wood grain hatches -->
    <path d="M 45,95 C 70,103 130,103 165,94" stroke-width="0.7" opacity="0.6" />
    <path d="M 55,85 C 75,90 120,90 150,84" stroke-width="0.7" opacity="0.4" />

    <!-- Grilled Steak -->
    <!-- Base / side of steak -->
    <path d="M 56,58 C 50,68 55,80 82,82 C 105,84 135,80 148,68 C 152,60 148,52 144,48" stroke-width="1.8" />
    
    <!-- Top cut surface of steak -->
    <path d="M 56,58 C 60,46 76,40 102,42 C 128,44 146,50 144,58 C 142,66 120,72 98,71 C 72,70 54,66 56,58 Z" stroke-width="1.8" />
    
    <!-- Grill marks & sear hatches on steak -->
    <path d="M 70,48 Q 85,55 98,65" stroke-width="1.5" />
    <path d="M 88,45 Q 104,52 118,63" stroke-width="1.5" />
    <path d="M 106,44 Q 120,50 132,60" stroke-width="1.5" />
    
    <!-- Sear cross-hatching on sides -->
    <path d="M 64,62 L 63,74" stroke-width="1" />
    <path d="M 72,65 L 72,77" stroke-width="1" />
    <path d="M 82,68 L 82,80" stroke-width="1" />
    <path d="M 94,69 L 94,81" stroke-width="1" />
    <path d="M 108,68 L 109,80" stroke-width="1" />
    <path d="M 122,66 L 124,77" stroke-width="1" />
    <path d="M 136,62 L 138,72" stroke-width="1" />

    <!-- Herb garnish on steak top -->
    <path d="M 98,43 C 96,30 90,24 88,20 C 93,24 99,32 100,40" stroke-width="1.3" />
    <path d="M 98,34 C 105,28 112,26 114,24 C 111,28 106,34 100,37" stroke-width="1.3" />
    <path d="M 99,31 C 99,22 101,17 101,15 C 103,19 103,26 100,33" stroke-width="1.3" />

    <!-- Chili Peppers on the Board -->
    <!-- Pepper 1 -->
    <path d="M 125,75 C 135,74 148,82 155,90 C 146,92 135,88 126,81 Z" stroke-width="1.4" />
    <path d="M 125,75 C 122,73 118,74 116,73" stroke-width="1.2" /> <!-- stem -->
    
    <!-- Pepper 2 -->
    <path d="M 140,86 C 150,86 162,92 168,98 C 158,100 148,96 141,91 Z" stroke-width="1.3" />
    <path d="M 140,86 C 138,84 135,85 133,84" stroke-width="1.1" /> <!-- stem -->
  </g>

  <!-- Number 25 below the steak board -->
  <text x="250" y="358" font-family="'Cinzel', 'Playfair Display', serif" font-size="16" font-weight="600" letter-spacing="4" fill="currentColor" text-anchor="middle">
    25
  </text>
</svg>
